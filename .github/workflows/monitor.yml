name: aoying-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: run monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python aoying_monitor.py

      - name: commit state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update state" || echo "no change"
          git push
